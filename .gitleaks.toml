title = "college-kb gitleaks config"

# Without this, a repo-local config REPLACES gitleaks' built-in ruleset
# (GitHub tokens, cloud keys, chat-app tokens, etc. would pass undetected).
[extend]
useDefault = true

[[rules]]
id = "generic-secret-assignment"
description = "Long secret-looking value assigned to a secret/token/password/key field"
regex = '''(?i)(api[_-]?key|access[_-]?key|secret|token|password|private[_-]?key)\s*[:=]\s*["']?[A-Za-z0-9_./+=:-]{20,}'''
keywords = ["api_key", "apikey", "api-key", "access_key", "access-key", "secret", "token", "password", "private_key", "private-key"]

[[rules]]
id = "private-key-block"
description = "Private key block"
regex = '''-----BEGIN [A-Z0-9 ]*PRIVATE KEY-----'''
keywords = ["PRIVATE KEY"]
